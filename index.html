<body>
<div id="root"></div>

<script>
// GrayCo Cloud Sync — loads latest content from GitHub before the app starts,
// and pushes every save to GitHub so all devices stay in sync.
(async function () {
  var KEY = 'grayco-site-content-v3';
  var REPO_API = 'https://api.github.com/repos/grayco-cs/grayco-website/contents/content.json';
  var SAVE_FN  = '/.netlify/functions/save-content';

  // ── STEP 1: Load latest content from GitHub before app starts ──────────────
  try {
    var res = await fetch(REPO_API, {
      headers: {
        'Accept': 'application/vnd.github.v3.raw',
        'Cache-Control': 'no-cache, no-store, must-revalidate'
      }
    });
    if (res.ok) {
      var text = await res.text();
      try {
        var parsed = JSON.parse(text);
        // Only replace local data if GitHub has real content (not just {})
        if (parsed && Object.keys(parsed).length > 1) {
          localStorage.setItem(KEY, text);
        }
      } catch (e) { /* ignore parse errors */ }
    }
  } catch (e) {
    console.warn('[GrayCo] Could not load from cloud, using local data:', e.message);
  }

  // ── STEP 2: Intercept saves so they also push to GitHub ────────────────────
  var _origSetItem = Storage.prototype.setItem;
  Storage.prototype.setItem = function (k, v) {
    _origSetItem.call(this, k, v);
    if (k === KEY) {
      fetch(SAVE_FN, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: v })
      }).then(function (r) {
        if (!r.ok) console.warn('[GrayCo] Cloud save returned error:', r.status);
        else console.log('[GrayCo] Saved to cloud successfully');
      }).catch(function (e) {
        console.warn('[GrayCo] Cloud save failed (site still saved locally):', e.message);
      });
    }
  };

  // ── STEP 3: Now start the app ──────────────────────────────────────────────
  var s = document.createElement('script');
  s.type = 'module';
  s.src = './assets/index-5ObGMj_N.js';
  document.body.appendChild(s);
})();
</script>
</body>
</html>
